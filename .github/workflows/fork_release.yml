name: fork_release
# Only triggered manually from a branch: Actions caches written by a tag run are scoped to that tag,
# so tag-triggered builds would never reuse the compilation cache of the previous release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the GitHub release to publish (leave empty to only build artifacts)
        type: string
        default: ''
permissions:
  contents: write
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache
jobs:
  bundle_linux_x86_64:
    runs-on: ubuntu-22.04
    steps:
    # The hosted runner does not have enough free disk for a release build of zed plus the musl remote_server.
    - name: free_disk_space
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: setup_sccache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
    - name: setup_linux
      run: ./script/linux
    - name: download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: bundle_linux
      run: ./script/bundle-linux
    - name: show_sccache_stats
      run: sccache --show-stats
    - name: upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-linux-x86_64.tar.gz
        path: target/release/zed-linux-x86_64.tar.gz
        if-no-files-found: error
    timeout-minutes: 180
  bundle_mac_aarch64:
    runs-on: macos-latest
    steps:
    - name: checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: setup_sccache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
    - name: setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: bundle_mac
      run: ./script/bundle-mac aarch64-apple-darwin
    - name: show_sccache_stats
      run: sccache --show-stats
    - name: upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-aarch64.dmg
        path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
        if-no-files-found: error
    timeout-minutes: 180
  publish_release:
    needs:
    - bundle_linux_x86_64
    - bundle_mac_aarch64
    if: inputs.release_tag != ''
    runs-on: ubuntu-22.04
    steps:
    - name: download_artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: ./artifacts/
        merge-multiple: true
    - name: create_release
      run: gh release create "$RELEASE_TAG" ./artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
    timeout-minutes: 10
